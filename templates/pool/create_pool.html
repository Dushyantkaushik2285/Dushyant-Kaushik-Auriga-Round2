<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Pool - FairShare</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-xl mx-auto px-6 py-12">

        <div class="mb-8">
            <a
                href="{% url 'dashboard' %}"
                class="text-sm text-gray-500 hover:text-gray-900"
            >
                ← Back to Dashboard
            </a>

            <h1 class="text-3xl font-bold text-gray-900 mt-4">
                Create Pool
            </h1>

            <p class="text-gray-600 mt-2">
                Set up a new contribution pool.
            </p>
        </div>


        <div class="bg-white rounded-xl shadow-sm p-6">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Pool Name
                    </label>

                    {{ form.name }}

                    {% if form.name.errors %}
                        <p class="text-red-600 text-sm mt-1">
                            {{ form.name.errors.0 }}
                        </p>
                    {% endif %}

                </div>


                <div class="mb-6">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Target Amount (₹)
                    </label>

                    {{ form.target_amount }}

                    {% if form.target_amount.errors %}
                        <p class="text-red-600 text-sm mt-1">
                            {{ form.target_amount.errors.0 }}
                        </p>
                    {% endif %}

                </div>


                <button
                    type="submit"
                    class="w-full bg-black text-white rounded-lg px-4 py-3 font-medium hover:bg-gray-800"
                >
                    Create Pool
                </button>

            </form>

        </div>

    </div>

</body>

</html>
